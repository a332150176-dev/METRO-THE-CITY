name: Build Android test APK

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/android-apk.yml"
      - ".github/debug.keystore.b64"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Set up Node.js for GLB asset preparation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Godot 4.3 and Android export templates
        run: |
          mkdir -p /tmp/godot /tmp/godot-templates
          curl -fL --retry 3 -o /tmp/godot-editor.zip https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot-editor.zip -d /tmp/godot
          install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/godot-templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Configure Android debug signing
        run: |
          # Shared debug key only; never use this key for a production release.
          base64 --decode .github/debug.keystore.b64 > "$HOME/debug.keystore"
          chmod 600 "$HOME/debug.keystore"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Fetch and prepare higher-detail visual assets
        run: |
          bash tools/fetch_visual_assets.sh
          npm install --prefix .github/visual-tools --no-save --no-audit --no-fund @gltf-transform/core@4.1.1 @gltf-transform/extensions@4.1.1 @gltf-transform/functions@4.1.1 meshoptimizer@0.22.0
          node .github/visual-tools/decompress-assets.mjs

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export and verify Android debug APK
        run: |
          mkdir -p build
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$ANDROID_HOME/platform-tools:$PATH"
          godot --headless --verbose --path . --export-debug "Android" build/METRO_THE_CITY_test.apk
          test -s build/METRO_THE_CITY_test.apk
          unzip -t build/METRO_THE_CITY_test.apk
          apksigner verify --verbose build/METRO_THE_CITY_test.apk

      - name: Upload APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: METRO-THE-CITY-Android-test-APK
          path: build/METRO_THE_CITY_test.apk
          if-no-files-found: error
          retention-days: 14
