name: Build Android test APK

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Prepare Godot Android export environment
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          cp /root/.config/godot/editor_settings-4.3.tres "$HOME/.config/godot/"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -f /root/debug.keystore

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          export PATH="$ANDROID_HOME/build-tools/33.0.2:$PATH"
          godot --headless --path . --export-debug "Android" build/METRO_THE_CITY_test.apk
          test -s build/METRO_THE_CITY_test.apk
          unzip -t build/METRO_THE_CITY_test.apk
          apksigner verify --verbose build/METRO_THE_CITY_test.apk

      - name: Upload APK for device testing
        uses: actions/upload-artifact@v4
        with:
          name: METRO-THE-CITY-Android-test-APK
          path: build/METRO_THE_CITY_test.apk
          if-no-files-found: error
          retention-days: 14
