name: Godot project validation

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js for GLB asset preparation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install curl for visual asset downloader
        run: apt-get update && apt-get install -y curl

      - name: Fetch and prepare higher-detail visual assets
        run: |
          bash tools/fetch_visual_assets.sh
          npm install --prefix .github/visual-tools --no-save --no-audit --no-fund @gltf-transform/core@4.1.1 @gltf-transform/extensions@4.1.1 @gltf-transform/functions@4.1.1 meshoptimizer@0.22.0
          node .github/visual-tools/decompress-assets.mjs

      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit

      - name: Run gameplay smoke test
        run: godot --headless --path . --script res://scripts/smoke_test.gd
