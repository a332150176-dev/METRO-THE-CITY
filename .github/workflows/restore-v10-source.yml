name: Restore V10 source archive

on:
  workflow_dispatch:
  push:
    paths:
      - ".source_transfer/**"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate and restore original project
        run: python tools/restore_source_archive.py

      - name: Commit restored Godot source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.source_transfer'
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Restore original METRO: THE CITY V10 source"
            git push
          fi
